<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Лёши 💌</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- canvas-confetti для сердечек-конфетти -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffebee, #ffc1e3, #ff80ab, #f8bbd0);
      background-size: 400% 400%;
      animation: gradient 18s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .small-heart {
      position: absolute;
      top: -10vh;
      color: #ff80ab;
      opacity: 0.7;
      animation: float-heart linear forwards;
      transform: translateX(var(--x, 0));
    }

    @keyframes float-heart {
      to { transform: translateY(110vh) translateX(calc(var(--x, 0) * 1.5)) rotate(720deg); opacity: 0; }
    }

    .scene {
      perspective: 1400px;
      position: relative;
      width: 570px;
      height: 780px;
      z-index: 10;
    }

    .envelope {
      width: 540px;
      height: 360px;
      position: relative;
      background: #d32f2f;
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 1.3s ease;
    }

    .envelope:hover {
      animation: shake 0.6s infinite ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotateX(0deg); }
      25%      { transform: translateX(-5px) rotateX(2deg); }
      75%      { transform: translateX(5px) rotateX(-2deg); }
    }

    .envelope.open {
      transform: translateY(-90px) rotateX(22deg);
    }

    .envelope::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #b71c1c;
      clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);
      z-index: 1;
      transition: clip-path 1.2s ease;
    }

    .envelope.open::before {
      clip-path: polygon(0 0, 100% 0, 100% 0, 50% 40%, 0 0);
    }

    .flap {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 50%;
      background: #b71c1c;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 1.2s ease 0.1s;
      z-index: 5;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .seal {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 90px;
      height: 90px;
      margin: -45px 0 0 -45px;
      background: #fff;
      border-radius: 50%;
      border: 6px solid #ff80ab;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.2);
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.6rem;
      color: #ff4081;
      transition: all 1s;
    }

    .envelope.open .seal {
      transform: translate(-50%, -210%) scale(0.7);
      opacity: 0.9;
    }

    .letter {
      position: absolute;
      width: 450px;
      min-height: 570px;
      background: #fffef7;
      left: 45px;
      top: 60px;
      padding: 52px 45px;
      box-sizing: border-box;
      border: 1.5px solid #eee;
      box-shadow: 0 15px 52px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(100px) scale(0.92);
      transition: all 1.5s ease 0.5s;
      z-index: 3;
      pointer-events: none;
      line-height: 1.65;
      color: #111;
      font-size: 1.85rem;
      text-align: center;
      font-family: 'Caveat', cursive;
    }

    .envelope.open ~ .letter {
      opacity: 1;
      transform: translateY(-240px) scale(1);
      pointer-events: auto;
      box-shadow: 0 20px 80px rgba(233, 30, 99, 0.35),
                  inset 0 0 40px rgba(255, 255, 255, 0.6);
    }

    .main-text p {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.9s ease-out;
      margin: 0 0 1.2em;
    }

    .envelope.open ~ .letter .main-text p:nth-child(1) { transition-delay: 0.9s; }
    .envelope.open ~ .letter .main-text p:nth-child(2) { transition-delay: 1.8s; }
    .envelope.open ~ .letter .main-text p:nth-child(3) { transition-delay: 2.7s; }

    .envelope.open ~ .letter .main-text p {
      opacity: 1;
      transform: translateY(0);
    }

    .signature-block {
      opacity: 0;
      transform: translateY(50px);
      transition: all 1.2s ease-out;
      transition-delay: 3.8s;
    }

    .envelope.open ~ .letter .signature-block {
      opacity: 1;
      transform: translateY(0);
    }

    .signature {
      text-align: right;
      margin-top: 4.5em;
      font-style: italic;
      font-size: 2.8rem;
      color: #c62828;
      font-weight: 700;
    }

    .from {
      text-align: right;
      margin-top: 0.8em;
      font-size: 2.4rem;
      color: #880e4f;
      font-weight: 600;
    }

    .hint {
      position: absolute;
      bottom: -70px;
      left: 50%;
      transform: translateX(-50%);
      color: #880e4f;
      font-size: 1.5rem;
      font-weight: 500;
      opacity: 0.9;
      transition: opacity 0.7s;
      pointer-events: none;
      z-index: 10;
      font-family: 'Caveat', cursive;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: translateX(-50%) scale(1); }
      50%      { opacity: 0.6; transform: translateX(-50%) scale(1.05); }
    }

    .envelope.open ~ .hint {
      opacity: 0 !important;
      animation: none !important;
    }
  </style>
</head>
<body>

<div id="hearts"></div>

<!-- Тихая романтическая музыка (короткий loop, royalty-free пример) -->
<audio id="bgMusic" loop volume="0.25">
  <source src="https://cdn.pixabay.com/audio/2023/08/07/audio_8d9b7d5e7a.mp3" type="audio/mpeg">
  <!-- Замени на любой короткий романтический piano mp3, если хочешь -->
</audio>

<div class="scene">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>

  <div class="letter">
    <div class="main-text">
      <p>Я помню день когда мы встретились,<br>Малышка крошка бейба 🐱💕</p>
      <p>Я помню вишней стал, а ты стал изумрудом.<br>Как изумруд сияешь, красивою лазурью 🌿✨</p>
      <p>Я наслаждаюсь тобою,<br>Ты драгоценный камень мой 💎❤️</p>
    </div>
    
    <div class="signature-block">
      <div class="signature">Люблю тебя, зайка моя ! 🐰💗</div>
      <div class="from">От Дениса 💚</div>
    </div>
  </div>

  <div class="hint">Жмякни по конвертику котик 😽</div>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const music = document.getElementById('bgMusic');

  envelope.addEventListener('click', () => {
    envelope.classList.toggle('open');
    if (envelope.classList.contains('open')) {
      music.play().catch(() => console.log("Автозапуск музыки заблокирован браузером"));
    }
  });

  // Конфетти-сердечки при открытии
  envelope.addEventListener('transitionend', function(e) {
    if (e.propertyName === 'transform' && this.classList.contains('open')) {
      const heartShape = confetti.shapeFromPath({
        path: 'M 12 21.35 L 10.55 20.03 C 5.4 15.36 2 12.27 2 8.5 C 2 5.42 4.42 3 7.5 3 C 9.24 3 10.91 3.81 12 5.09 C 13.09 3.81 14.76 3 16.5 3 C 19.58 3 22 5.42 22 8.5 C 22 12.27 18.6 15.36 13.45 20.03 L 12 21.35 Z'
      });

      confetti({
        particleCount: 100,
        spread: 80,
        startVelocity: 35,
        ticks: 200,
        gravity: 0.5,
        origin: { y: 0.6 },
        shapes: [heartShape],
        colors: ['#ff80ab', '#f06292', '#ec407a', '#d81b60', '#c2185b'],
        scalar: 1.2
      });
    }
  });

  // Сердечки на фоне (крупные)
  const container = document.getElementById('hearts');

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'small-heart';
    heart.textContent = ['❤️','💗','💖','💘','💓'][Math.floor(Math.random()*5)];
    heart.style.fontSize = (Math.random() * 2.2 + 1.4) + 'rem';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.setProperty('--x', (Math.random() * 500 - 250) + 'px');
    const duration = Math.random() * 8 + 9;
    heart.style.animationDuration = duration + 's';
    heart.style.animationDelay = Math.random() * 2.5 + 's';
    heart.style.opacity = Math.random() * 0.4 + 0.35;
    container.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000 + 1500);
  }

  setInterval(createHeart, 280);
  for (let i = 0; i < 20; i++) setTimeout(createHeart, i * 180);
</script>

</body>
</html>
